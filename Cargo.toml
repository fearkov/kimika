[workspace]
resolver = "2"
members = [
    "crates/kimika",
    "crates/kimika-cpu",
    "crates/kimika-core",
    "crates/kimika-gpu",
    "crates/kimika-gxm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/fearkov/kimika"

[workspace.dependencies]
kimika-cpu = { path = "crates/kimika-cpu" }
kimika-core = { path = "crates/kimika-core" }
kimika-gxm = { path = "crates/kimika-gxm" }
vita-module = { git = "https://github.com/fearkov/vitarecomp" }

log = "0.4"
thiserror = "2"

[profile.dev]
opt-level = 1
debug = true

# the interpreters are unusably slow in a plain debug build
[profile.dev.package.kimika-cpu]
opt-level = 3

[profile.dev.package.kimika-gxm]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = 1
